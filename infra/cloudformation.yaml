AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Property Area Measurement (PAM) prototype - ECS Fargate service behind an
  Application Load Balancer, S3 result store, Secrets Manager keys, CloudWatch
  logs and alarms, CPU autoscaling.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI with tag, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/pam-api:0.1.0
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones
  ApiKeys:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Comma-separated API keys accepted by the service (stored in Secrets Manager)
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 20
  MaxCount:
    Type: Number
    Default: 6
    MinValue: 1
    MaxValue: 50
  TaskCpu:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096"]
  TaskMemory:
    Type: String
    Default: "4096"
    AllowedValues: ["2048", "4096", "8192", "16384"]
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN. When set, HTTPS on 443 and HTTP redirects to it.
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may reach the load balancer (narrow this for a private pilot)
  ResultRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email for CloudWatch alarm notifications

Conditions:
  HasCert: !Not [!Equals [!Ref CertificateArn, ""]]
  NoCert: !Equals [!Ref CertificateArn, ""]
  HasEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # ---------------------------------------------------------------- storage & secrets
  ResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-results
            Status: Enabled
            Prefix: pam/results/
            ExpirationInDays: !Ref ResultRetentionDays
          - Id: expire-inputs
            Status: Enabled
            Prefix: pam/inputs/
            ExpirationInDays: !Ref ResultRetentionDays

  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub "${ResultsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ApiKeysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/api-keys"
      Description: API keys accepted by the PAM service (comma-separated)
      SecretString: !Ref ApiKeys

  ImageryKeysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/imagery-keys"
      Description: Imagery provider credentials (JSON). Fill in to enable /v1/measure/address.
      SecretString: '{"PAM_GOOGLE_MAPS_KEY": "", "PAM_MAPBOX_TOKEN": "", "PAM_NEARMAP_KEY": ""}'

  # ---------------------------------------------------------------- logging & IAM
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref ApiKeysSecret, !Ref ImageryKeysSecret]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: results-bucket
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${ResultsBucket.Arn}/pam/*"

  # ---------------------------------------------------------------- networking
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PAM load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr}

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PAM tasks (only the load balancer may connect)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "120"}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /v1/ready
      HealthCheckIntervalSeconds: 20
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  HttpListenerForward:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  HttpListenerRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: "443", StatusCode: HTTP_301}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCert
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  # ---------------------------------------------------------------- compute
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - {Name: containerInsights, Value: enabled}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - {ContainerPort: 8080, Protocol: tcp}
          Environment:
            - {Name: PAM_S3_BUCKET, Value: !Ref ResultsBucket}
            - {Name: PAM_S3_PREFIX, Value: pam/}
            - {Name: PAM_LOG_LEVEL, Value: INFO}
            - {Name: PAM_RATE_LIMIT_PER_MIN, Value: "120"}
          Secrets:
            - {Name: PAM_API_KEYS, ValueFrom: !Ref ApiKeysSecret}
            - {Name: PAM_GOOGLE_MAPS_KEY, ValueFrom: !Sub "${ImageryKeysSecret}:PAM_GOOGLE_MAPS_KEY::"}
            - {Name: PAM_MAPBOX_TOKEN, ValueFrom: !Sub "${ImageryKeysSecret}:PAM_MAPBOX_TOKEN::"}
            - {Name: PAM_NEARMAP_KEY, ValueFrom: !Sub "${ImageryKeysSecret}:PAM_NEARMAP_KEY::"}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          ReadonlyRootFilesystem: false

  Service:
    Type: AWS::ECS::Service
    DependsOn: [ListenerReady]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - {ContainerName: api, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}

  # Wait handle so the service starts only after a listener exists (either branch)
  ListenerReady:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      Listener: !If [HasCert, !Ref HttpsListener, !Ref HttpListenerForward]

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      MinCapacity: !Ref DesiredCount
      MaxCapacity: !Ref MaxCount

  CpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cpu-target-60
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 120
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  # ---------------------------------------------------------------- alarms
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasEmail
    Properties:
      Subscription:
        - {Endpoint: !Ref AlarmEmail, Protocol: email}

  Errors5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PAM API returning 5xx errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PAM p95 response time above 3 s (NFR-03)
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasEmail, [!Ref AlarmTopic], !Ref "AWS::NoValue"]

Outputs:
  ApiUrl:
    Description: Base URL of the API and client interface
    Value: !If [HasCert, !Sub "https://${LoadBalancer.DNSName}", !Sub "http://${LoadBalancer.DNSName}"]
  ResultsBucketName:
    Value: !Ref ResultsBucket
  ApiKeysSecretArn:
    Value: !Ref ApiKeysSecret
  ImageryKeysSecretArn:
    Value: !Ref ImageryKeysSecret
  LogGroupName:
    Value: !Ref LogGroup
